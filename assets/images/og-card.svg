<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="220" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="250" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Logo Mark -->
  <rect x="100" y="100" width="72" height="72" rx="16" fill="url(#brandGrad)"/>
  <text x="136" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" fill="#ffffff" text-anchor="middle">CA</text>

  <!-- Title -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#ffffff" letter-spacing="-1">ConsultAnythingTech</text>
  
  <!-- Subtitle -->
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="32" fill="#818cf8">Technology Consultancy &amp; Digital Product Studio</text>
  
  <!-- Description -->
  <text x="100" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">Distributed Systems • High-Performance Web &amp; Native • AI Workflows • Security</text>

  <!-- Domain -->
  <rect x="100" y="490" width="360" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="280" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" fill="#e2e8f0" text-anchor="middle">consultanything-tech.github.io</text>
</svg>
