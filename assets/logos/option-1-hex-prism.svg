<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" aria-label="ConsultAnythingTech Option 1: Geometric Hex Prism">
  <defs>
    <!-- Facet Gradients -->
    <linearGradient id="prism-top" x1="20" y1="24" x2="100" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="prism-left" x1="20" y1="54" x2="60" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="prism-right" x1="60" y1="54" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="prism-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ambient Shadow Filter -->
    <radialGradient id="prism-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Ambient Glow -->
  <ellipse cx="60" cy="98" rx="42" ry="12" fill="url(#prism-shadow)" />

  <!-- Isometric Hex Prism Structure -->
  <!-- Top Facet (Rhombus) -->
  <polygon points="60,18 98,38 60,58 22,38" fill="url(#prism-top)" stroke="#7dd3fc" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Left Facet -->
  <polygon points="22,38 60,58 60,98 22,78" fill="url(#prism-left)" stroke="#6366f1" stroke-width="1" stroke-linejoin="round" />

  <!-- Right Facet -->
  <polygon points="60,58 98,38 98,78 60,98" fill="url(#prism-right)" stroke="#38bdf8" stroke-width="1" stroke-linejoin="round" />

  <!-- Interior Lattice / Bus Lines -->
  <path d="M60,18 L60,58 M22,38 L60,58 M98,38 L60,58 M60,58 L60,98" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round" />
  <path d="M41,28 L79,48 M41,48 L41,88 M79,48 L79,88" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Interconnected Data Vertices (Glowing Nodes) -->
  <!-- Top Apex -->
  <circle cx="60" cy="18" r="3.5" fill="#ffffff" filter="url(#prism-glow)" />
  <circle cx="60" cy="18" r="2" fill="#38bdf8" />

  <!-- Center Hub -->
  <circle cx="60" cy="58" r="4.5" fill="#ffffff" filter="url(#prism-glow)" />
  <circle cx="60" cy="58" r="2.5" fill="#6366f1" />

  <!-- Left & Right Nodes -->
  <circle cx="22" cy="38" r="3" fill="#a855f7" />
  <circle cx="22" cy="38" r="1.5" fill="#ffffff" />
  <circle cx="98" cy="38" r="3" fill="#38bdf8" />
  <circle cx="98" cy="38" r="1.5" fill="#ffffff" />

  <!-- Bottom Apex -->
  <circle cx="60" cy="98" r="3.5" fill="#06b6d4" />
  <circle cx="60" cy="98" r="2" fill="#ffffff" />

  <!-- Side Bottom Vertices -->
  <circle cx="22" cy="78" r="2.5" fill="#818cf8" />
  <circle cx="98" cy="78" r="2.5" fill="#0284c7" />
</svg>
