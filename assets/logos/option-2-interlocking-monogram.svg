<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" aria-label="ConsultAnythingTech Option 2: Interlocking Monogram">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mono-c-grad" x1="16" y1="20" x2="88" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="mono-a-grad" x1="40" y1="14" x2="108" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="mono-bridge-grad" x1="44" y1="62" x2="92" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="mono-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="mono-bg-glow" cx="60" cy="60" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#mono-bg-glow)" />

  <!-- Monogram Outer Geometric "C" Ribbon -->
  <!-- Curves from top right, wraps around left side, terminates at bottom right -->
  <path
    d="M 86,28 L 48,28 C 30,28 18,40 18,60 C 18,80 30,92 48,92 L 86,92 L 86,80 L 48,80 C 37,80 30,73 30,60 C 30,47 37,40 48,40 L 86,40 Z"
    fill="url(#mono-c-grad)"
  />

  <!-- Interlocking Chevron "A" Structure -->
  <!-- Apex rises through the center, legs anchor downward -->
  <path
    d="M 68,16 L 98,76 L 85,76 L 79,64 L 57,64 L 64,52 L 73,52 L 68,40 L 68,16 Z"
    fill="url(#mono-a-grad)"
  />

  <!-- High-Tech Translucent Bridge / Data Bar linking C & A -->
  <polygon points="44,58 92,58 88,66 40,66" fill="url(#mono-bridge-grad)" opacity="0.9" />

  <!-- Apex Quantum Core (Glowing Top Vector) -->
  <circle cx="68" cy="18" r="4" fill="#38bdf8" filter="url(#mono-glow)" />
  <circle cx="68" cy="18" r="2" fill="#ffffff" />

  <!-- Accent Detail Line -->
  <path d="M 38,50 L 38,70" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="86" cy="28" r="3" fill="#06b6d4" />
  <circle cx="86" cy="92" r="3" fill="#6366f1" />
</svg>
