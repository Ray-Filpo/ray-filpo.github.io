<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%" fill="none" aria-label="CATech Logo">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="logo-bg" x1="4" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="logo-border" x1="4" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Infinity Ribbon Gradients -->
    <linearGradient id="logo-inf-grad-1" x1="10" y1="30" x2="110" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="logo-inf-grad-2" x1="110" y1="30" x2="10" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logo-inf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="logo-inf-ambient" cx="60" cy="60" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="wordmark-tech" x1="240" y1="26" x2="295" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark: Option 4 Möbius Infinity Code Emblem -->
  <g transform="translate(4, 8)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#logo-bg)" stroke="url(#logo-border)" stroke-width="1.5" />
    
    <g transform="scale(0.4)">
      <!-- Ambient Backdrop -->
      <circle cx="60" cy="60" r="45" fill="url(#logo-inf-ambient)" />

      <!-- Underlying Infinity Loop Track -->
      <path
        d="M 60,60 C 45,40 30,36 20,44 C 10,52 10,68 20,76 C 30,84 45,80 60,60 C 75,40 90,36 100,44 C 110,52 110,68 100,76 C 90,84 75,80 60,60 Z"
        stroke="url(#logo-inf-grad-1)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- High-Precision Code Bracket Glyphs { and } Embedded into Vertices -->
      <!-- Opening Brace { on Left Loop -->
      <path
        d="M 28,42 C 24,42 21,45 21,49 L 21,54 C 21,57 18,59 15,60 C 18,61 21,63 21,66 L 21,71 C 21,75 24,78 28,78"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#logo-inf-glow)"
      />

      <!-- Closing Brace } on Right Loop -->
      <path
        d="M 92,42 C 96,42 99,45 99,49 L 99,54 C 99,57 102,59 105,60 C 102,61 99,63 99,66 L 99,71 C 99,75 96,78 92,78"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#logo-inf-glow)"
      />

      <!-- Möbius Crossing Ribbon Overlap Layer (Creating 3D Twist) -->
      <path
        d="M 48,46 C 54,52 66,68 72,74"
        stroke="url(#logo-inf-grad-2)"
        stroke-width="11"
        stroke-linecap="round"
      />
      <path
        d="M 48,46 C 54,52 66,68 72,74"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.6"
      />

      <!-- Active Data Pulses on Rails -->
      <circle cx="60" cy="60" r="3.5" fill="#ffffff" filter="url(#logo-inf-glow)" />
      <circle cx="15" cy="60" r="2.5" fill="#06b6d4" />
      <circle cx="105" cy="60" r="2.5" fill="#10b981" />
      <circle cx="36" cy="38" r="2" fill="#38bdf8" />
      <circle cx="84" cy="82" r="2" fill="#a855f7" />
    </g>
  </g>

  <!-- Typographic Wordmark -->
  <text x="66" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="24" fill="#f8fafc" letter-spacing="-0.5">
    CA<tspan fill="url(#wordmark-tech)" font-weight="800">Tech</tspan>
  </text>

  <!-- Engineering Subtitle -->
  <text x="67" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#94a3b8" letter-spacing="2.8">
    SYSTEMS &bull; ADVISORY &bull; STUDIO
  </text>
</svg>